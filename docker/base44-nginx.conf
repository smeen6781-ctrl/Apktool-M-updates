server {
    listen 80;
    server_name _;

    # Dedicated document root: the image's own /usr/share/nginx/html holds a
    # welcome index.html that would hide the feed listing.
    root /srv/feed;

    charset utf-8;
    autoindex on;
    autoindex_exact_size off;

    location / {
        try_files $uri $uri/ =404;
    }
}
